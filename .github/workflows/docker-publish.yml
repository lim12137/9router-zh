name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync Upstream Repository
    types:
      - completed

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/9router

jobs:
  build-per-platform:
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip docker]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_id: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: docker-publish-${{ github.event_name }}-${{ github.ref_name || 'default' }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-cn
            type=ref,event=tag,suffix=-cn
            type=semver,pattern={{version}},suffix=-cn
            type=sha,format=short,prefix=sha-,suffix=-cn
            type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Shanghai'}},prefix=nightly-,suffix=-cn
            type=raw,value=latest-cn,enable={{is_default_branch}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.platform_id }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.platform_id }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_id }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    if: ${{ needs.build-per-platform.result == 'success' }}
    needs: build-per-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-cn
            type=ref,event=tag,suffix=-cn
            type=semver,pattern={{version}},suffix=-cn
            type=sha,format=short,prefix=sha-,suffix=-cn
            type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Shanghai'}},prefix=nightly-,suffix=-cn
            type=raw,value=latest-cn,enable={{is_default_branch}}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list
        shell: bash
        run: |
          set -euo pipefail

          sources=()
          for digest_file in /tmp/digests/*; do
            [ -f "$digest_file" ] || continue
            sources+=("${{ env.GHCR_IMAGE }}@sha256:$(basename "$digest_file")")
          done

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No digests found to assemble manifest list" >&2
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< "${{ steps.meta.outputs.tags }}"
