name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: "Push to Docker Hub (requires secrets)"
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows:
      - Sync Upstream Repository
    types:
      - completed

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/9router

jobs:
  build-and-push:
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip docker]'))
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-${{ github.ref_name || 'default' }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve image names and publish flags
        id: vars
        shell: bash
        run: |
          dockerhub_image="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$dockerhub_image" ]; then
            dockerhub_image="${{ github.repository_owner }}/9router"
          fi
          echo "dockerhub_image=$dockerhub_image" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_to_dockerhub }}" != "true" ]; then
            echo "publish_dockerhub=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "publish_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.vars.outputs.publish_dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (GHCR only)
        if: ${{ steps.vars.outputs.publish_dockerhub != 'true' }}
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-cn
            type=ref,event=tag,suffix=-cn
            type=semver,pattern={{version}},suffix=-cn
            type=sha,format=short,prefix=sha-,suffix=-cn
            type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Shanghai'}},prefix=nightly-,suffix=-cn
            type=raw,value=latest-cn,enable={{is_default_branch}}

      - name: Extract metadata (GHCR + Docker Hub)
        if: ${{ steps.vars.outputs.publish_dockerhub == 'true' }}
        id: meta_all
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.vars.outputs.dockerhub_image }}
          tags: |
            type=ref,event=branch,suffix=-cn
            type=ref,event=tag,suffix=-cn
            type=semver,pattern={{version}},suffix=-cn
            type=sha,format=short,prefix=sha-,suffix=-cn
            type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Shanghai'}},prefix=nightly-,suffix=-cn
            type=raw,value=latest-cn,enable={{is_default_branch}}

      - name: Build and push (GHCR only)
        if: ${{ steps.vars.outputs.publish_dockerhub != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      - name: Build and push (GHCR + Docker Hub)
        if: ${{ steps.vars.outputs.publish_dockerhub == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta_all.outputs.tags }}
          labels: ${{ steps.meta_all.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
